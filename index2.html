<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>안녕하세요</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --text: #1b2a41;
      --sub: #5a6b85;
      --accent: #2f6fed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101826;
        --text: #eef2f9;
        --sub: #9db0cc;
        --accent: #6c9bff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 12px;
    }
    p {
      font-size: 1.1rem;
      color: var(--sub);
      margin: 0 0 28px;
    }
    button {
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      cursor: pointer;
    }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">안녕하세요!</h1>
    <p>첫 번째 웹페이지에 오신 것을 환영합니다.</p>
    <button id="btn" type="button">인사하기</button>
  </main>
  <script>
    document.getElementById('btn').addEventListener('click', function () {
      document.getElementById('title').textContent = 'Hello, World!';
    });
  </script>
</body>
</html>
